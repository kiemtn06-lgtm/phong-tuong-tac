<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tương tác trên lớp</title>
<style>
:root{--bg:#f4f7fb;--fg:#13233a;--card:#fff;--ac:#1f6feb;--ok:#1a7f37;--mut:#5b6b80;--bd:#d5dde8}
@media (prefers-color-scheme:dark){:root{--bg:#0d1b2a;--fg:#eaf0f7;--card:#14263b;--ac:#4c9aff;--ok:#3fb950;--mut:#9fb0c4;--bd:#2b4560}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.mut{color:var(--mut);font-size:15px}
input,select{width:100%;font-size:18px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)}
button{font-size:18px;padding:14px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;width:100%;margin-top:10px;cursor:pointer}
button.alt{background:transparent;color:var(--ac);border:2px solid var(--ac)}
button:disabled{opacity:.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{margin:0;padding:22px 0;font-size:24px}
.opts button.on{background:var(--ok)}
.called{background:#ffd166;color:#3a2a00;text-align:center;font-size:22px;font-weight:600;border-radius:12px;padding:16px;margin:12px 0}
.err{color:#d1242f;min-height:1.4em}
.res{border-radius:10px;padding:12px;margin-top:10px;background:var(--bg);border:1px solid var(--bd)}
.res.good{border-color:var(--ok)}
.res.bad{border-color:#d1242f}
.tfr{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center;margin:6px 0}
.tfr button{margin:0;padding:12px 0}
.tfr button.on{background:var(--ok)}
.tfr button.on.s{background:#d1242f}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  var app = document.getElementById("app");
  var qs = new URLSearchParams(location.search);
  var code = (qs.get("c") || "").replace(/\D/g, "").slice(0, 4);
  var K = function (n) { return "tt." + code + "." + n; };
  var tfSel = [], tfQ = "", st = null, err = "", name = "", tok = "", timer = null, typing = false, pick = "", last = "";
  function get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function put(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function api(path, body) {
    var o = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ code: code, name: name, tok: tok }, body)) } : {};
    var u = "/api/s/" + path + (body ? "" : "?code=" + code + "&name=" + encodeURIComponent(name));
    return fetch(u, o).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "Lỗi"); return j; }); });
  }
  function poll() {
    api("state").then(function (j) { var k = JSON.stringify(j); st = j; if (k === last || typing) return; last = k; draw(); }, function (e) { err = e.message; st = null; last = ""; if (!typing) draw(); });
  }
  function draw() {
    if (!code) { app.innerHTML = '<div class="card"><h1>Vào lớp</h1><p class="mut">Nhập mã 4 số trên màn hình lớp.</p><input id="mc" inputmode="numeric" maxlength="4" placeholder="Mã phòng"><button id="go">Vào</button></div>'; return; }
    if (!st) { app.innerHTML = '<div class="card"><h1>Tương tác trên lớp</h1><p class="err">' + esc(err) + "</p></div>"; return; }
    var h = '<h1>' + esc(st.lop) + '</h1><div class="mut">' + esc(st.bai) + "</div>";
    if (st.ended) { app.innerHTML = h + '<div class="card">Tiết học đã kết thúc. Cảm ơn em!</div>'; return; }
    if (!st.me || !st.me.joined) {
      h += '<div class="card"><label class="mut" for="nm">Chọn tên của em</label><select id="nm"><option value="">-- chọn --</option>' +
        st.roster.map(function (n) { return '<option value="' + esc(n) + '"' + (n === (pick || name) ? " selected" : "") + (st.present[n] && n !== name ? " disabled" : "") + ">" + esc(n) + (st.present[n] && n !== name ? " (đã vào)" : "") + "</option>"; }).join("") +
        '</select><button id="join">Vào lớp</button><div class="err">' + esc(err) + "</div></div>";
      app.innerHTML = h; return;
    }
    h += '<div class="mut">Em: <b>' + esc(name) + '</b> &nbsp;<span style="color:var(--ok)">● Đã vào lớp</span></div>';
    if (st.me.called) h += '<div class="called">Thầy/cô đang gọi em trình bày!</div>';
    h += '<div class="card"><button id="hand" class="' + (st.me.hand ? "" : "alt") + '">' + (st.me.hand ? "Đang giơ tay (bấm để hạ)" : "Giơ tay xin phát biểu") + "</button></div>";
    var q = st.q;
    if (!q) h += '<div class="card"><b>Câu hỏi</b><p class="mut">Chưa có câu hỏi. Khi thầy/cô đưa câu hỏi, ô trả lời sẽ hiện ngay ở đây (không cần tải lại trang).</p></div>';
    if (q) {
      h += '<div class="card"><b>' + (q.open ? "Câu hỏi" : "Câu hỏi (đã đóng)") + "</b>" + (q.label ? '<div class="mut">' + esc(q.label) + "</div>" : "");
      var n = q.n || 4, L = "abcdef";
      if (tfQ !== q.id) { tfQ = q.id; tfSel = []; for (var z = 0; z < n; z++) tfSel.push(null); }
      var DS = function (arr) { return arr.map(function (x, i) { return L[i] + ":" + (x ? "Đ" : "S"); }).join("  "); };
      if (q.mine != null) h += '<p>Em đã trả lời: <b>' + esc(Array.isArray(q.mine) ? DS(q.mine) : q.mine) + "</b></p>";
      else if (q.open && q.type === "tf") h += '<div class="tf">' + tfSel.map(function (v, i) { return '<div class="tfr"><b>' + L[i] + ')</b><button data-tf="' + i + ':1" class="' + (v === true ? "on" : "alt") + '">Đúng</button><button data-tf="' + i + ':0" class="' + (v === false ? "on s" : "alt") + '">Sai</button></div>'; }).join("") + '<button id="sendTf"' + (tfSel.every(function (x) { return x !== null; }) ? "" : " disabled") + ">Gửi</button></div>";
      else if (q.open && q.type === "mc") h += '<div class="opts">' + ["A", "B", "C", "D"].map(function (x) { return '<button data-ans="' + x + '">' + x + "</button>"; }).join("") + "</div>";
      else if (q.open) h += '<input id="sa" maxlength="80" placeholder="Nhập câu trả lời"><button id="sendA">Gửi</button>';
      else if (q.mine == null) h += '<p class="mut">Em chưa trả lời câu này.</p>';
      if (!q.open && q.key) {
        var good = q.type === "tf" ? (q.ok && q.ok.every(Boolean)) : q.ok;
        h += '<div class="res ' + (q.mine == null ? "" : good ? "good" : "bad") + '"><b>' + (q.mine == null ? "Đáp án" : good ? "Đúng rồi!" : "Chưa đúng") + "</b><br>Đáp án đúng: <b>" + esc(q.type === "tf" ? DS(q.key) : q.type === "short" ? q.key.v : q.key) + "</b>";
        if (q.type === "tf" && q.ok && q.mine != null) h += '<br><span class="mut">Em đúng ' + q.ok.filter(Boolean).length + "/" + q.key.length + " ý</span>";
        if (q.e) h += '<div class="mut" style="margin-top:6px">' + esc(q.e) + "</div>";
        h += "</div>";
      }
      h += "</div>";
    }
    h += '<div class="err">' + esc(err) + "</div>";
    app.innerHTML = h;
    var sa = document.getElementById("sa");
    if (sa) { sa.onfocus = function () { typing = true; }; sa.onblur = function () { typing = false; }; }
  }
  function act(path, body) { err = ""; last = ""; return api(path, body).then(poll, function (e) { err = e.message; draw(); }); }
  app.addEventListener("focusin", function (e) { if (e.target.id === "nm") typing = true; });
  app.addEventListener("focusout", function (e) { if (e.target.id === "nm") typing = false; });
  app.addEventListener("change", function (e) { if (e.target.id === "nm") pick = e.target.value; });
  app.addEventListener("click", function (e) {
    var t = e.target;
    if (t.id === "go") { var c = document.getElementById("mc").value.replace(/\D/g, ""); if (c.length === 4) location.search = "?c=" + c; return; }
    if (t.id === "join") {
      var v = document.getElementById("nm").value; if (!v) { err = "Chọn tên của em"; draw(); return; }
      name = v; pick = v; typing = false; put(K("name"), v);
      tok = get(K("tok")) || (Math.random().toString(36).slice(2) + Date.now().toString(36)); put(K("tok"), tok);
      act("join", {}); return;
    }
    if (t.id === "hand") return act("hand", {});
    var tfb = t.getAttribute && t.getAttribute("data-tf");
    if (tfb) { var pr = tfb.split(":"); tfSel[+pr[0]] = pr[1] === "1"; last = ""; draw(); return; }
    if (t.id === "sendTf") { if (tfSel.some(function (x) { return x === null; })) return; return act("answer", { value: tfSel.slice() }); }
    if (t.id === "sendA") { var s = document.getElementById("sa").value; typing = false; return act("answer", { value: s }); }
    if (t.getAttribute && t.getAttribute("data-ans")) return act("answer", { value: t.getAttribute("data-ans") });
  });
  name = get(K("name")); tok = get(K("tok"));
  draw();
  if (code) { poll(); timer = setInterval(poll, 2000); }
})();
</script>
</body>
</html>
